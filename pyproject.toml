[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "somame-local"
version = "0.2.0"
description = "Somame Local: one supervised AI specialist on your own machine, under a write gate that always returns deleting, paying, publishing and changing access to a person. Provenance, a hash-chained audit log and a web office included."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Akrosystems Ltd" }]
keywords = ["agents", "supervision", "provenance", "audit", "local-first", "raspberry-pi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# No runtime dependencies, deliberately. The parts of a system that decide
# what needs a human should be auditable without reading a dependency tree.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.11", "ruff==0.8.6"]
# The web office in PostgreSQL rather than SQLite.
postgres = ["psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/Akrosystems/somame-local"
Issues = "https://github.com/Akrosystems/somame-local/issues"

[project.scripts]
somame-local = "somame_local.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/somame_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
files = ["src/somame_local"]
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "BLE"]
ignore = [
  "E501",
  # Errors are named for what happened (IdentityUnresolved, AclStale), the
  # way the same rules name them in Somame Cloud.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
# http.server calls its handlers do_GET and do_POST.
"src/somame_local/office.py" = ["N802"]
"tests/test_local_cloud.py" = ["N802"]
